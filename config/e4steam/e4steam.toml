# Whether to hide the domain on chat and only allow copying
# default: false
hideDomainInChat = false
# Allows use of dedicated server commands such as /ban in a shared LAN world
# default: true
restoreDedicatedCommands = true
# Whether to share opened LAN worlds through Steam P2P and Valve relays
# default: true
hostEnabled = true
# Fallback UDP port for voice mods and other UDP services; Simple Voice Chat and Plasmo Voice are detected automatically; use 0 to disable the fallback
# default: 24454
voiceChatPort = 24454
# Experimental: on Linux and macOS, relaunch Minecraft before LWJGL starts so Steam can inject its overlay; set true to enable
# default: false
overlayRelaunch = false
# Authenticate ordinary LAN/TCP players with Minecraft services; Steam players always use Steam authentication
# default: true
lanOnlineMode = true
# Whether PvP is enabled in an opened integrated LAN world
# default: true
lanPvp = true
# Total integrated-server player limit, including the host
# default: 8
lanMaxPlayers = 8
# Local Minecraft listener port used when opening a world to LAN
# default: 25565
lanPort = 25565
# default: 
publicServerName = ""
# Default game mode applied when opening or editing a shared LAN world
# default: survival
lanGameMode = "survival"
# Whether commands/cheats are enabled for players in the integrated LAN world
# default: false
lanAllowCheats = false
