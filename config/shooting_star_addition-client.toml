#How Halley and Luna look on this computer. These only change what you see.
[looks]
	#The sky goes dark while the comet comes in (stars, an aurora, the comet lighting up the air),
	#and hazy with ice after the impact (a halo and sun dogs round the sun).
	sky = true
	#The land dims under that dark sky, so the comet's light stands out.
	darken_land = true
	#Fragments bursting in the sky, ice thrown out of the crater, cracks across the ground,
	#the shock wall, the heart's beam and glittering air after the impact.
	extra_effects = true
	#The whole world lights up for an instant at touchdown and at the impact.
	#Turn this off if flashing light bothers you.
	world_flashes = true
	#An arrow at the edge of the screen pointing at the comet while it's out of view.
	comet_marker = true
	#Shader packs (Iris) only show what is drawn with Minecraft's own shaders, so while one is on
	#Halley paints its comet and sky onto textures first and draws those the way the pack expects.
	#AUTO: do that whenever a shader pack is on. ALWAYS: do it all the time. NEVER: don't (with a
	#shader pack on, the comet and the sky then won't show).
	#AUTO only sees Iris (and ports that keep Iris's API). With OptiFine's shaders, set ALWAYS.
	#Allowed Values: AUTO, ALWAYS, NEVER
	shader_packs = "AUTO"

#Your switches in the Stellar Remote's menu (H). They are saved here when you flip them there.
[stellar_remote]
	#Play the skills' music: Luna's as the moon comes down, Proxima's as the flare comes in (M in the remote's menu).
	luna_music = true
	#Cast without cooldowns where the server allows it (its no_cooldown setting; C in the remote's
	#menu). Has no effect on a server that doesn't allow it.
	no_cooldown = true
	#In creative, standing where your own strike lands: true lifts you straight up above it, false
	#takes you out to the crater's edge (onto land that is loaded, else up). E in the remote's menu.
	evac_lift = true
	#Luna's moon model stays where it landed instead of crumbling into the block moon, until you switch
	#this off or leave the world (for filming). L in the remote's menu.
	keep_moon = false
	#Luna's Epic mode: the moon you call down falls slower and more ominously (24 s from the alarm to the
	#impact instead of 16; everyone watching sees it), with the long cut of her music. G in the remote's menu.
	epic_mode = false
	#Distances in the films' readouts (altitude, the flare's front, the shock wave): false for kilometres
	#and metres, true for miles and feet. The - key in the remote's menu.
	imperial_units = false
	#Strikes cast one after another each keep their own music playing (true), or the newest one's music
	#takes over (false). The = key in the remote's menu.
	stack_music = false
	#Clicking a skill in the remote's menu picks it and closes the menu (true), or the menu stays open
	#(false, as before). The [ key in the remote's menu.
	close_menu_on_pick = false
	#Halley's and Luna's impact frames (the screen flashing to negative at an impact): FULL, SOFT
	#(fainter) or OFF. F in the remote's menu.
	#Allowed Values: FULL, SOFT, OFF
	impact_frames = "FULL"
	#SA-00 Stellar Convergence: the remote's skills it fires, by id (ticked with 1-9 on its plate in the
	#remote's menu). Each fires with its own sliders.
	convergence = ["the_shooting_star", "gungnir", "seven_stars", "tesseract", "halley", "luna", "proxima"]
	#Stellar Convergence: true spreads its weapons in a ring round the crosshair, false puts them all on
	#it. R in the remote's menu.
	convergence_ring = false
	#Stellar Convergence's plate in the remote's menu, shown while it is the selected skill (false: just its
	#name). V in the remote's menu.
	convergence_plate = true
	#Stellar Convergence's plate in its old look: always shown in the remote's menu, at the addon plate's
	#size (false: the smaller one, shown while it is the selected skill). T in the remote's menu.
	convergence_plate_old = false
	#The screen shake while a Stellar Convergence is on its way and for 20 s after it hits: CAPPED (no
	#stronger than one big weapon's, though every weapon shakes), FULL (every weapon's added up) or OFF. X in the remote's menu.
	#Allowed Values: CAPPED, FULL, OFF
	convergence_shake = "CAPPED"
	#The addon's plates in the remote's menu (its settings, and Stellar Convergence's): false hides them and
	#their keys. The settings above still apply; change them in this file.
	menu_plates = true
