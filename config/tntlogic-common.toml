["Dynamic Explosions"]
	#Maximum number of falling blocks per explosion (protects against lag).
	# Default: 2500
	# Range: 10 ~ 10000
	maxFallingBlocksPerExplosion = 2500
	#Whether destroying the base of a structure (e.g. a tower) makes it physically collapse and scatter.
	enableLargeStructuresCollapse = true
	#How strongly blocks scatter sideways when a large structure collapses.
	# Default: 0.2
	# Range: 0.0 ~ 2.0
	physicsScatteringForce = 0.2
	#Distance from the explosion within which structures are checked for lost support.
	# Default: 5
	# Range: 1 ~ 15
	instabilityRadius = 5
	#How far the collapse zone grows at most over tall structures. The zone in which overhanging blocks drop grows by the height of the structure above the crater (up to this value) - otherwise hanging bridges and standing pillars stay over the crater.
	# Default: 32
	# Range: 1 ~ 64
	maxCollapseRadius = 32
	#How many blocks above the crater are analysed. Taller unsupported structures are only read in when they can actually fall (saves performance underground).
	# Default: 16
	# Range: 4 ~ 64
	scanHeightAboveExplosion = 16
	#Chance that a block left hanging right above the crater after the blast (cave ceiling, underside of a floating island) drops. 0 = off.
	# Default: 0.35
	# Range: 0.0 ~ 1.0
	looseBlockChance = 0.35
	#Whether blocks over the maxFallingBlocksPerExplosion limit drop as items (can cause lag). Containers always spill their contents.
	dropExcessBlocksAsItems = false
	#What happens to containers (chests, barrels, shulker boxes, furnaces, hoppers...) that lost their support in a collapse. A container never holds a building up and never loses its contents.
	#FALL - falls with its contents (default)
	#STAY - stays where it was, contents untouched
	#BREAK - breaks and drops its contents
	#Containers hit directly by the blast behave as in vanilla.
	#Allowed Values: STAY, FALL, BREAK
	containerCollapseMode = "FALL"
	#Version of this file - do not change. A file without it was written while STAY was the default.
	# Default: 0
	# Range: > 0
	configVersion = 2
